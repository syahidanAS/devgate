server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    root /var/www/devgate/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/devgate/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/devgate/public;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}