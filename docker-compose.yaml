services:
  # ----------------------------------------------------
  # 1. Main PHP-FPM Application Container
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devgate_app
    restart: unless-stopped
    working_dir: /var/www/devgate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/var/www/devgate
    networks:
      - devgate_net

  # ----------------------------------------------------
  # 2. Nginx Web Server Container
  # ----------------------------------------------------
  web:
    image: nginx:alpine
    container_name: devgate_web
    restart: unless-stopped
    ports:
      - "3007:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/devgate:ro
    depends_on:
      - app
    networks:
      - devgate_net

  # ----------------------------------------------------
  # 3. Redis Cache & Queue Broker Container
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: devgate_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devgate_net

  # ----------------------------------------------------
  # 4. Laravel Queue Worker Container
  # ----------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devgate_queue
    restart: unless-stopped
    working_dir: /var/www/devgate
    command: php artisan queue:work --tries=3 --timeout=90
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/var/www/devgate
    networks:
      - devgate_net

# ------------------------------------------------------
# Named Volumes & Networks Persistence
# ------------------------------------------------------
volumes:
  redis_data:

networks:
  devgate_net:
    driver: bridge
