services:
  # ----------------------------------------------------
  # 1. Main PHP-FPM Application Container
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devgate_app
    restart: unless-stopped
    working_dir: /var/www/devgate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - devgate_net

  # ----------------------------------------------------
  # 2. Nginx Web Server Container
  # ----------------------------------------------------
  web:
    image: nginx:alpine
    container_name: devgate_web
    restart: unless-stopped
    ports:
      - "3007:80"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - devgate_net

  # ----------------------------------------------------
  # 3. Redis Cache & Queue Broker Container
  # ----------------------------------------------------
  redis:
    image: redis:alpine
    container_name: devgate_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devgate_net

  # ----------------------------------------------------
  # 4. Laravel Queue Worker Container
  # ----------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devgate_queue
    restart: unless-stopped
    working_dir: /var/www/devgate
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - devgate_net

# ------------------------------------------------------
# Named Volumes
# ------------------------------------------------------
volumes:
  redis_data:

    # ------------------------------------------------------
    # Docker Networks
    # ------------------------------------------------------
networks:
  devgate_net:
    driver: bridge
